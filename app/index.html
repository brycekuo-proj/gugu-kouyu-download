/* 布局：单列卡片流，平板上两到四列网格；按钮是有“底边厚度”的实体按键，方便小手按 */
:root{
  --bg:#E6F2EE; --bg2:#D7EBE4; --card:#FFFFFF; --ink:#1D3445; --muted:#5D7585; --line:#CFE1DA;
  --sky:#2F7FE0; --sky-d:#1F5FAF; --coral:#FF6A45; --coral-d:#D24A27; --leaf:#1F9D66; --leaf-d:#147049;
  --plum:#7C5CE6; --plum-d:#5A3EB8; --sun:#FFC23C; --sun-d:#D99A12; --red:#E5484D;
  --en:"Andika","Comic Sans MS","Segoe UI",system-ui,sans-serif;
  --zh:system-ui,-apple-system,"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
  --r:20px; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--zh);-webkit-user-select:none;user-select:none;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.en{font-family:var(--en)}
#app{max-width:1080px;margin:0 auto;min-height:100%;padding:0 16px 32px;display:flex;flex-direction:column}
/* 顶栏 */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 0 10px;background:var(--bg)}
.top h1{flex:1;min-width:0;margin:0;font-size:21px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{font-weight:600;color:var(--muted);font-size:14px;margin-left:6px}
.ib{width:46px;height:46px;border-radius:14px;background:var(--card);display:grid;place-items:center;font-size:22px;box-shadow:0 3px 0 var(--line);flex:none}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px;box-shadow:0 2px 0 var(--line);white-space:nowrap}
/* 实体按钮 */
.btn{--c:var(--sky);--d:var(--sky-d);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 22px;border-radius:18px;background:var(--c);color:#fff;font-weight:800;font-size:19px;box-shadow:0 5px 0 var(--d);transition:transform .06s,box-shadow .06s,opacity .2s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--d)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.coral{--c:var(--coral);--d:var(--coral-d)} .btn.leaf{--c:var(--leaf);--d:var(--leaf-d)} .btn.plum{--c:var(--plum);--d:var(--plum-d)} .btn.sun{--c:var(--sun);--d:var(--sun-d);color:#3B2A00}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn.wide{width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
/* 首页 */
.hero{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r);padding:14px 16px;margin-top:4px;box-shadow:0 4px 0 var(--line)}
.owl{width:84px;height:84px;flex:none}
.bubble{flex:1;min-width:0}
.bubble b{display:block;font-size:20px}
.bubble span{color:var(--muted);font-size:15px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.cont{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--ink);color:#fff;border-radius:var(--r);padding:16px 18px;box-shadow:0 5px 0 #0E1E29;margin-bottom:14px}
.cont:active{transform:translateY(3px);box-shadow:0 2px 0 #0E1E29}
.cont .k{font-size:13px;opacity:.75;letter-spacing:.06em}
.cont .t{font-size:20px;font-weight:800}
.cont .go{margin-left:auto;font-size:30px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{--c:var(--sky);--d:var(--sky-d);position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:150px;padding:16px;border-radius:var(--r);background:var(--c);color:#fff;text-align:left;box-shadow:0 6px 0 var(--d);overflow:hidden}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--d)}
.tile .n{font-size:13px;font-weight:800;opacity:.8}
.tile .h{font-size:23px;font-weight:900;line-height:1.2}
.tile .d{font-size:14px;opacity:.9}
.tile .ic{position:absolute;right:-6px;bottom:-10px;font-size:70px;line-height:1;opacity:.95}
.tile .ic .pic{width:78px;height:78px}
.tile.coral{--c:var(--coral);--d:var(--coral-d)} .tile.leaf{--c:var(--leaf);--d:var(--leaf-d)} .tile.plum{--c:var(--plum);--d:var(--plum-d)}
.sec{margin:20px 0 10px;font-size:15px;font-weight:800;color:var(--muted);letter-spacing:.04em}
/* 图片 */
.pic{display:inline-grid;place-items:center;width:1em;height:1em;line-height:1}
.pic svg{width:100%;height:100%}
.pic.emo{font-size:.92em}
.pic.badge b{display:grid;place-items:center;width:100%;height:100%;border-radius:22%;background:var(--sun);color:#3B2A00;font:900 .5em/1 var(--en)}
.pic.none{opacity:.5}
/* 分段 & 列表 */
.seg{display:flex;gap:6px;background:var(--bg2);border-radius:16px;padding:5px;margin-bottom:12px}
.seg button{flex:1;min-height:46px;border-radius:12px;font-weight:800;font-size:17px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.list{display:grid;gap:12px}
@media(min-width:760px){.list.two{grid-template-columns:1fr 1fr}}
.unit{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:0 4px 0 var(--line)}
.unit:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.unit .no{flex:none;width:56px;height:56px;border-radius:16px;background:var(--bg2);display:grid;place-items:center;font:800 15px/1.1 var(--en);text-align:center}
.unit .tx{flex:1;min-width:0}
.unit .tx b{display:block;font:700 19px/1.25 var(--en)}
.unit .tx span{color:var(--muted);font-size:15px}
.unit .st{flex:none;font-size:18px;letter-spacing:-2px}
.dots{display:flex;gap:4px;margin-top:4px}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--leaf)}
/* 单元页三步 */
.steps{display:grid;gap:12px}
.step{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 4px 0 var(--line);width:100%;text-align:left}
.step:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.step .num{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff;background:var(--sky)}
.step.done .num{background:var(--leaf)}
.step b{font-size:20px} .step span{display:block;color:var(--muted);font-size:15px}
.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.wcard{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border-radius:16px;padding:12px 6px;box-shadow:0 3px 0 var(--line);font-size:48px}
.wcard>.pic{width:56px;height:56px;font-size:48px}
.unit .no .pic{width:38px;height:38px;font-size:34px}
.wcard:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.wcard b{font:700 18px/1.2 var(--en);text-align:center;word-break:break-word}
.wcard span{font-size:13px;color:var(--muted)}
/* 学习卡 */
.stage{flex:1;display:flex;flex-direction:column;gap:14px}
.prog{height:10px;background:var(--bg2);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--leaf);border-radius:5px;transition:width .3s}
.card{position:relative;background:var(--card);border-radius:28px;padding:22px 18px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.card .big{font-size:132px;height:150px;display:grid;place-items:center}
.card .big .pic{width:140px;height:140px}
.card .word{font:700 46px/1.15 var(--en);word-break:break-word}
.card .sent{font:700 31px/1.35 var(--en);max-width:30ch}
.card .zh{font-size:21px;color:var(--muted)}
.card .ex{margin-top:6px;padding:10px 14px;border-radius:14px;background:var(--bg);font:600 19px/1.4 var(--en);display:flex;gap:8px;align-items:center}
.card .ex small{display:block;font:15px var(--zh);color:var(--muted)}
.card.speaking .word,.card.speaking .sent{color:var(--sky)}
.letterhead{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:var(--r);padding:12px 16px;box-shadow:0 4px 0 var(--line)}
.letterhead .L{flex:none;font:700 54px/1 var(--en);color:var(--coral);white-space:nowrap}
.letterhead>div{min-width:0}
.letterhead .ph{font:700 24px/1.3 var(--en)}
.letterhead .ph.zh{font:800 18px/1.4 var(--zh)}
.letterhead p{margin:2px 0 0;color:var(--muted);font-size:15px}
.seg-w{font:700 54px/1.1 var(--en)}
.seg-w .on{color:var(--coral)} .seg-w .ri{color:var(--sky)}
/* 跟读条 */
.follow{display:flex;align-items:center;gap:12px;min-height:74px;border-radius:20px;padding:10px 16px;background:var(--bg2);font-weight:800;font-size:19px}
.follow .ico{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--card)}
.follow .msg{flex:1;min-width:0}
.follow .msg small{display:block;font-weight:600;font-size:14px;color:var(--muted)}
.follow .bar{height:8px;border-radius:4px;background:rgba(0,0,0,.08);margin-top:6px;overflow:hidden}
.follow .bar i{display:block;height:100%;width:100%;background:var(--coral);transform-origin:left}
.follow[data-st=listen]{background:#DCEBFC} .follow[data-st=listen] .ico{animation:pulse 1s infinite}
.follow[data-st=you]{background:#FFE3D9} .follow[data-st=you] .ico{background:var(--coral);color:#fff;animation:pulse .8s infinite}
.follow[data-st=hear]{background:#EDE6FF}
.follow[data-st=done]{background:#DDF3E8}
.follow .skip{flex:none;min-height:44px;padding:0 14px;border-radius:12px;background:var(--card);font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
@keyframes pulse{50%{transform:scale(1.12)}}
.ctrl{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px}
.ctrl .btn{padding:0 10px;font-size:18px}
.toggle{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--muted)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--leaf)} .sw.on::after{left:23px}
/* 测验 */
.q{background:var(--card);border-radius:28px;padding:18px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.q .ask{font-size:18px;font-weight:800;color:var(--muted)}
.q .play{width:96px;height:96px;border-radius:50%;background:var(--sky);color:#fff;font-size:44px;box-shadow:0 6px 0 var(--sky-d)}
.q .play:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sky-d)}
.q .play.on{animation:pulse 1s infinite}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.opt{min-height:96px;border-radius:20px;background:var(--bg);box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;font:700 24px/1.2 var(--en)}
.opt.pic{font-size:70px;min-height:120px}
.opt.pic .pic{width:80px;height:80px}
.opt.zh{font:700 19px/1.35 var(--zh)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.ok{background:#CFF0DE;box-shadow:0 4px 0 var(--leaf)} .opt.no{background:#FFD9D6;box-shadow:0 4px 0 var(--red);animation:shake .35s}
.opts.locked .opt{pointer-events:none}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.order-ans,.order-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;min-height:62px;padding:8px;border-radius:16px}
.order-ans{background:var(--bg);border:2px dashed var(--line)}
.wchip{min-height:50px;padding:0 16px;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--line);font:700 22px var(--en);border:2px solid var(--line)}
.wchip.used{visibility:hidden}
.feedback{min-height:30px;font-weight:800;font-size:20px}
.feedback.ok{color:var(--leaf)} .feedback.no{color:var(--red)}
/* 结果 */
.result{background:var(--card);border-radius:28px;padding:26px 18px;box-shadow:0 6px 0 var(--line);text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.result .stars{font-size:56px;letter-spacing:6px}
.result .stars .off{filter:grayscale(1);opacity:.3}
.result h2{margin:0;font-size:28px}
.result p{margin:0;color:var(--muted)}
/* 游戏 */
.gamebox{position:relative;height:min(62vh,560px);border-radius:28px;background:linear-gradient(#BFE3FF,#E9F6FF);overflow:hidden;box-shadow:0 6px 0 var(--line)}
.balloon{position:absolute;bottom:-110px;width:min(22%,120px);display:flex;flex-direction:column;align-items:center;animation:rise linear forwards}
.balloon .bb{width:100%;aspect-ratio:110/126;border-radius:50% 50% 46% 46%;display:grid;place-items:center;font-size:clamp(34px,8vw,58px);box-shadow:inset -10px -12px 0 rgba(0,0,0,.08)}
.balloon .bb .pic{width:60%;height:60%}
.balloon::after{content:"";width:2px;height:30px;background:#7B8A95}
.balloon.pop{animation:popb .35s forwards!important}
@keyframes rise{to{transform:translateY(calc(-1 * min(62vh,560px) - 170px))}}
@keyframes popb{to{transform:scale(1.6);opacity:0}}
.memo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:620px){.memo{grid-template-columns:repeat(4,1fr)}}
.mc{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:18px}
.mc .in{position:absolute;inset:0}
.mc .fa,.mc .ba{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;box-shadow:0 4px 0 var(--line)}
.mc .fa{background:var(--plum);color:#fff;font:900 40px/1 var(--en);box-shadow:0 4px 0 var(--plum-d)}
.mc .ba{display:none;background:var(--card);font:700 clamp(16px,3.4vw,24px)/1.2 var(--en);padding:6px;text-align:center}
.mc.up .fa,.mc.got .fa{display:none}
.mc.up .ba,.mc.got .ba{display:grid;animation:flip .25s ease-out}
.mc .ba .pic{width:60%;height:60%;font-size:56px}
.mc.got .ba{background:#CFF0DE;box-shadow:0 4px 0 var(--leaf)}
@keyframes flip{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.blank{font:700 60px/1 var(--en);letter-spacing:6px}
.blank .gap{display:inline-block;min-width:.8em;border-bottom:5px solid var(--coral);color:var(--coral)}
/* 贴纸 */
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.stk{aspect-ratio:1;border-radius:18px;background:var(--card);display:grid;place-items:center;font-size:48px;box-shadow:0 3px 0 var(--line)}
.stk .pic{width:56px;height:56px}
.stk.lock{background:var(--bg2);font-size:26px;color:var(--muted)}
/* 设置 */
.set{background:var(--card);border-radius:var(--r);padding:6px 16px;box-shadow:0 4px 0 var(--line)}
.set .it{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;border-bottom:1px solid var(--line)}
.set .it:last-child{border-bottom:0}
.set .it b{display:block;font-size:18px}
.set .it span{display:block;color:var(--muted);font-size:14px}
.set .seg{margin:0;flex:none}
.set .seg button{min-width:56px;padding:0 10px;min-height:40px;font-size:15px}
.note{color:var(--muted);font-size:14px;line-height:1.6}
/* 提示 */
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:15}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

 time for school.","该上学了。"],["It's time for dinner.","该吃晚饭了。"],["OK, it's time for bed.","好的，该睡觉了。"],["I'm late for school.","我上学要迟到了。"],["Look at the clock!","看看钟！"],["Silly me!","我真傻！"]]},{"no":"Unit 4","t":"I'm Skating","zh":"我在滑冰","w":[["flying a kite","在放风筝","🪁"],["skipping rope","在跳绳","🪢"],["skating","在滑冰","⛸️"],["riding a bike","在骑自行车","🚲"],["drinking","在喝","🥤"],["swimming","在游泳","🏊"],["dancing","在跳舞","💃"],["running","在跑步","🏃"],["singing","在唱歌","🎤"],["cola","可乐","🥤"],["sun","太阳","☀️"],["kite","风筝","🪁"]],"s":[["I'm flying a kite.","我在放风筝。"],["I'm skipping rope.","我在跳绳。"],["I'm skating.","我在滑冰。"],["I'm riding a bike.","我在骑自行车。"],["I'm drinking cola.","我在喝可乐。"],["I'm swimming.","我在游泳。"],["Are you skating?","你在滑冰吗？"],["No, I'm not.","不，我没有。"],["Are you riding a bike?","你在骑自行车吗？"],["Yes, I am.","是的，我在骑。"],["What are you doing?","你在做什么？"],["I'm dancing.","我在跳舞。"],["You are kidding!","你在开玩笑吧！"],["Don't be silly.","别傻了。"],["It's not a bird.","那不是鸟。"],["It's a kite.","那是一个风筝。"],["He's flying the kite.","他在放风筝。"],["Can I fly the kite?","我可以放这个风筝吗？"],["Watch out!","当心！"]]},{"no":"Unit 5","t":"Mum's Washing Up","zh":"妈妈在洗碗","w":[["wash up","洗碗","🍽️"],["mop the floor","拖地","🧹"],["read","读","📖"],["newspaper","报纸","📰"],["do a puzzle","拼拼图","🧩"],["set the table","摆碗筷","🥢"],["computer","电脑","💻"],["computer games","电脑游戏","🎮"],["cook","做饭","🧑‍🍳"],["apple pie","苹果派","🥧"]],"s":[["Mum is washing up.","妈妈在洗碗。"],["Dad is mopping the floor.","爸爸在拖地。"],["Grandpa is reading a newspaper.","爷爷在看报纸。"],["Grandma is watching TV.","奶奶在看电视。"],["Where's David?","大卫在哪里？"],["In his room.","在他的房间里。"],["What's he doing?","他在做什么？"],["He's doing a puzzle.","他在拼拼图。"],["What's she doing?","她在做什么？"],["She's setting the table.","她在摆碗筷。"],["Where's Mum?","妈妈在哪里？"],["She's cooking.","她在做饭。"],["He's playing computer games.","他在玩电脑游戏。"],["I'm doing my homework.","我在做作业。"],["Can you help me?","你能帮我吗？"],["I'm sorry.","对不起。"],["Never mind.","没关系。"],["I can do it myself.","我可以自己做。"],["No, thank you.","不用了，谢谢。"] const Rec = {

  async start() {

    hear: ['👂', '听听你读的', ''],

/* ---------- 测验 ---------- */
function makeQuiz(words, sents, pool, n) {
  n = n || 8;
  const picW = words.filter(w => w.pic);
  const poolPic = pool.filter(w => w.pic);
  const qs = [];
  const opts4 = (ans, src, field) => {
    const seen = new Set([ans[field].toLowerCase ? ans[field].toLowerCase() : ans[field]]);
    const out = [ans];
    for (const w of shuffle(src)) {
      const k = w[field].toLowerCase ? w[field].toLowerCase() : w[field];
      if (!seen.has(k) && w.en.toLowerCase() !== ans.en.toLowerCase() && w.pic !== ans.pic && w.zh !== ans.zh) { seen.add(k); out.push(w); }
      if (out.length === 4) break;
    }
    return shuffle(out);
  };
  const nW = sents.length ? Math.min(5, picW.length) : Math.min(8, picW.length);
  pickN(picW, nW).forEach((w, k) => {
    qs.push(k % 2 === 0 ? { t: 'listen', ans: w, opts: opts4(w, picW.concat(poolPic), 'pic') } : { t: 'see', ans: w, opts: opts4(w, picW.concat(poolPic), 'en') });
  });
  const shortS = sents.filter(s => { const k = s.en.split(' ').length; return k >= 3 && k <= 7; });
  const sz = pickN(sents, Math.max(0, Math.min(sents.length, n - qs.length - (shortS.length ? 1 : 0))));
  sz.forEach(s => { const others = shuffle(sents.filter(x => x.zh !== s.zh)).slice(0, 2); qs.push({ t: 'mean', ans: s, opts: shuffle([s].concat(others)) }); });
  if (shortS.length) qs.push({ t: 'order', ans: pickN(shortS, 1)[0] });
  return shuffle(qs).slice(0, n);
}

  if (S.pool === 'theme') return THEMES.flatMap(t => t.words);

}

SCREENS.g_balloon = () => {
  const pool = gradePool().filter(w => w.pic);
  const rounds = pickN(pool, 8);
  let r = 0, score = 0, busy = false, launch = 0;
  const cols = ['#FF8A80', '#FFD54F', '#81C784', '#64B5F6', '#BA68C8', '#FFB74D'];
  const start = async () => {
    const box = $('#gbox'); if (!box) return;
    const myF = FLOW;
    busy = true;
    const ans = rounds[r];
    const others = pickN(pool.filter(w => w.pic !== ans.pic), 3);
    const set = shuffle([ans].concat(others));
    box.innerHTML = '';
    const my = ++launch;
    $('#gcount').textContent = (r + 1) + ' / ' + rounds.length;
    await say(ans.en);
    if (my !== launch || myF !== FLOW || !box.isConnected) return;
    busy = false;
    set.forEach((w, k) => {
      const b = document.createElement('button');
      b.className = 'balloon'; b.dataset.a = 'pop'; b.dataset.en = w.en;
      b.style.left = (6 + k * 23) + '%';
      b.style.animationDuration = (9 + Math.random() * 3) + 's';
      b.style.animationDelay = (k * .2) + 's';
      b.innerHTML = '<span class="bb" style="background:' + cols[(k + r) % cols.length] + '">' + pic(w.pic) + '</span>';
      box.appendChild(b);
    });
    // 气球全部飞走还没点：重放并重新放气球
    const myL = launch;
    setTimeout(() => { if (myL === launch && !busy && myF === FLOW && box.isConnected) start(); }, 13500);
  };
  return {
    html: topbar('气球听音', '<span id="gcount"></span>', '<button class="ib" data-a="rep" aria-label="再听">🔊</button>') + '<div class="gamebox" id="gbox"></div><p class="note">听到哪个单词，就戳哪个气球。按右上角 🔊 可以再听。</p>',
    mount() { start(); },
    on(a, el) {
      if (a === 'rep') say(rounds[r].en);
      if (a === 'pop' && !busy) {
        const ok = el.dataset.en === rounds[r].en;
        beep(ok);
        if (!ok) { el.classList.add('pop'); return; }
        busy = true; launch++; score++;
        el.classList.add('pop');
        $$('#gbox .balloon').forEach(b => { b.style.animationPlayState = 'paused'; });

        say(rounds[r].en).then(async () => {          // 读完再进下一轮

          if (my !== FLOW) return;
          r++;

        });
      }
    },
  };
};

    $('#count').textContent = (i + 1) + ' / ' + words.length;
    $('#prog').style.width = (i / words.length * 100) + '%';
    $('#qwrap').innerHTML = '<div class="q"><div class="ask">听一听，缺了哪个字母？</div><div class="card" style="box-shadow:none;padding:0"><div class="big">' + pic(w.pic) + '</div></div><div class="blank" id="blank">' + esc(w.en.slice(0, vi)) + '<span class="gap">_</span>' + esc(w.en.slice(vi + 1)) + '</div><div class="opts" id="opts" style="grid-template-columns:repeat(5,1fr)">' + 'aeiou'.split('').map(v => '<button class="opt" data-a="v" data-v="' + v + '" style="min-height:72px;font-size:34px">' + v + '</button>').join('') + '</div><div class="feedback" id="fb"></div></div>';
    $('#next').hidden = true;
    say(w.en);
  };
  return {
    html: topbar('补元音', '<span id="count"></span>', '<button class="ib" data-a="rep" aria-label="再听">🔊</button>') + '<div class="stage"><div class="prog"><i id="prog"></i></div><div id="qwrap"></div><button class="btn leaf wide" id="next" data-a="next" hidden>下一题 ▶</button></div>',
    mount() { paint(); },
    async on(a, el) {
      const w = words[i];
      if (a === 'rep') say(w.en);
      if (a === 'v' && !answered) {
        const ok = el.dataset.v === w.v; answered = true; if (ok) right++; beep(ok);
        $('#opts').classList.add('locked'); el.classList.add(ok ? 'ok' : 'no');
        if (!ok) $$('#opts .opt').forEach(b => { if (b.dataset.v === w.v) b.classList.add('ok'); });
        $('.gap').textContent = w.v;
        const fb = $('#fb'); fb.className = 'feedback ' + (ok ? 'ok' : 'no'); fb.textContent = ok ? '对啦！' : '是 ' + w.v + ' 哦';
        const my = ++FLOW; await sleep(300); if (my !== FLOW) return;
        await say(w.en); if (my !== FLOW) return;
        const nb = $('#next'); nb.hidden = false; nb.textContent = i === words.length - 1 ? '完成 ▶' : '下一题 ▶';
      }
      if (a === 'next') { cancelFlow(); if (i < words.length - 1) { i++; paint(); } else gameDone('补元音', 'vowel', '补对了 ' + right + ' / ' + words.length + ' 个', 'g_vowel'); }
    },
  };
};
/* 听音找首字母 */
SCREENS.g_first = () => {
  const all = PH.letters.flatMap(L => L[3].filter(x => x[0][0].toUpperCase() === L[0]).map(x => W(x[0], x[1], x[2], { L: L[0] })));
  const words = pickN(all, 8);
  let i = 0, right = 0, answered = false;
  const paint = () => {
    answered = false;
    const w = words[i];
    const letters = shuffle([w.L].concat(pickN(PH.letters.map(L => L[0]).filter(x => x !== w.L), 2)));
    $('#count').textContent = (i + 1) + ' / ' + words.length;
    $('#prog').style.width = (i / words.length * 100) + '%';
    $('#qwrap').innerHTML = '<div class="q"><div class="ask">听单词，它用哪个字母开头？</div><button class="play" data-a="rep">🔊</button><div class="opts" id="opts" style="grid-template-columns:repeat(3,1fr)">' + letters.map(l => '<button class="opt" data-a="l" data-l="' + l + '" style="font-size:44px;min-height:100px">' + l + l.toLowerCase() + '</button>').join('') + '</div><div id="reveal"></div><div class="feedback" id="fb"></div></div>';
    $('#next').hidden = true;
    say(w.en);
  };
  return {
    html: topbar('听音找首字母', '<span id="count"></span>') + '<div class="stage"><div class="prog"><i id="prog"></i></div><div id="qwrap"></div><button class="btn leaf wide" id="next" data-a="next" hidden>下一题 ▶</button></div>',
    mount() { paint(); },
    async on(a, el) {
      const w = words[i];
      if (a === 'rep') say(w.en);
      if (a === 'l' && !answered) {
        const ok = el.dataset.l === w.L; answered = true; if (ok) right++; beep(ok);
        $('#opts').classList.add('locked'); el.classList.add(ok ? 'ok' : 'no');
        if (!ok) $$('#opts .opt').forEach(b => { if (b.dataset.l === w.L) b.classList.add('ok'); });
        $('#reveal').innerHTML = '<div style="font-size:70px">' + pic(w.pic) + '</div><div class="word en" style="font:700 36px var(--en)"><span style="color:var(--coral)">' + esc(w.en[0]) + '</span>' + esc(w.en.slice(1)) + '</div>';
        const fb = $('#fb'); fb.className = 'feedback ' + (ok ? 'ok' : 'no'); fb.textContent = ok ? '对啦！' : '是 ' + w.L + ' 哦';
        const my = ++FLOW; await sleep(300); if (my !== FLOW) return;
        await say(w.en); if (my !== FLOW) return;
        const nb = $('#next'); nb.hidden = false; nb.textContent = i === words.length - 1 ? '完成 ▶' : '下一题 ▶';
      }
      if (a === 'next') { cancelFlow(); if (i < words.length - 1) { i++; paint(); } else gameDone('听音找首字母', 'first', '找对了 ' + right + ' / ' + words.length + ' 个', 'g_first'); }
    },
  };
};

/* ---------- 贴纸册 ---------- */
SCREENS.stickers = () => {
  const have = Math.min(STICKERS.length, Math.floor(S.stars / STAR_PER_STICKER));
  const need = STAR_PER_STICKER - S.stars % STAR_PER_STICKER;
  return {
    html: topbar('我的贴纸册', '已收集 ' + have + ' / ' + STICKERS.length) +
      '<p class="note" style="margin-top:0">每攒 ' + STAR_PER_STICKER + ' 颗星换一张贴纸。' + (have < STICKERS.length ? '再得 ' + need + ' 颗星就有新贴纸！' : '全部集齐啦！') + '</p>' +
      '<div class="stickers">' + STICKERS.map((s, k) => k < have ? '<div class="stk">' + pic(s) + '</div>' : '<div class="stk lock">?</div>').join('') + '</div>',
  };
};

/* ---------- 家长设置 ---------- */
SCREENS.settings = () => {
  let confirmReset = false;
  const segs = (name, opts, val) => '<div class="seg">' + opts.map(o => '<button data-a="' + name + '" data-v="' + o[0] + '" class="' + (String(val) === String(o[0]) ? 'on' : '') + '">' + o[1] + '</button>').join('') + '</div>';
  const html = () => topbar('家长设置') + '<div class="set">' +
    '<div class="it"><div><b>语速</b><span>慢速适合刚开始跟读</span></div>' + segs('slow', [[false, '正常'], [true, '慢速']], S.set.slow) + '</div>' +
    '<div class="it"><div><b>跟读时间</b><span>每句录音放完后，留给孩子读的时间</span></div>' + segs('turn', [[0.8, '短'], [1, '中'], [1.5, '长']], S.set.turn) + '</div>' +
    '<div class="it"><div><b>录音回放</b><span>跟读时录下孩子的声音，再放给他听</span></div>' + segs('rec', [[true, '开'], [false, '关']], S.set.rec) + '</div>' +
    '<div class="it"><div><b>自动连读</b><span>跟读结束后自动进入下一个</span></div>' + segs('auto', [[false, '关'], [true, '开']], S.set.auto) + '</div>' +
    '<div class="it"><div><b>年级</b><span>首页“继续学习”和游戏用这个年级</span></div>' + segs('gr', [[1, '一年级'], [2, '二年级']], S.grade) + '</div>' +
    '<div class="it"><div><b>清除学习记录</b><span>星星、进度全部归零</span></div><button class="btn ' + (confirmReset ? 'coral' : 'ghost') + '" data-a="reset" style="min-height:44px;font-size:16px">' + (confirmReset ? '再按一次确认' : '清除') + '</button></div>' +
    '</div><p class="note">教材：广州出版社《英语（口语）》一、二年级上下册，单元内容按网上公开的课文整理，如与孩子手上的版本有出入，以课本为准。<br>' + (WEB ? '网页版：第一次打开后会自动把录音存到本机，之后不联网也能用。' : '所有单词、句子都已内置录音，不需要联网。') + '版本 ' + (NB && NB.appVersion ? esc(NB.appVersion()) : (WEB ? '网页版 ' + DATA_VER : '预览版')) + '</p>';
  return {
    html: html(),
    on(a, el) {
      const v = el.dataset.v;
      if (a === 'slow') S.set.slow = v === 'true';
      if (a === 'turn') S.set.turn = +v;
      if (a === 'rec') S.set.rec = v === 'true';
      if (a === 'auto') S.set.auto = v === 'true';
      if (a === 'gr') { S.grade = +v; S.term = '上册'; }
      if (a === 'reset') {
        if (!confirmReset) { confirmReset = true; app.innerHTML = html(); return; }
        S = Object.assign(loadState(), { stars: 0, prog: {}, days: {}, got: {}, last: '' }); toast('学习记录已清除');
      }
      confirmReset = false; save(); app.innerHTML = html();
      if (a === 'slow') say('Hello! Let\'s learn English.');
    },
  };
};

/* ================= 启动 ================= */
document.addEventListener('visibilitychange', () => { if (document.hidden) cancelFlow(); });
go('home');

/* 网页版：注册离线缓存，并在空闲时把全部录音下载到本机（之后断网也能用） */
if (WEB && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => {
    let done = false;
    try { done = localStorage.getItem('gzky.offline') === DATA_VER; } catch (e) { /* ignore */ }
    if (done) return;
    const urls = Array.from(new Set(Object.values(AUDIO).filter(u => u && !u.startsWith('data:'))));
    let i = 0, ok = 0;
    const worker = async () => {
      while (i < urls.length) {
        const u = urls[i++];
        try { const r = await fetch(u); if (r.ok) { await r.arrayBuffer(); ok++; } } catch (e) { /* 下次再试 */ }
      }
    };
    setTimeout(() => Promise.all([worker(), worker(), worker()]).then(() => {
      if (ok === urls.length) { try { localStorage.setItem('gzky.offline', DATA_VER); } catch (e) { /* ignore */ } }
    }), 3000);
  }).catch(() => { /* 不支持离线也能正常用 */ });
}
